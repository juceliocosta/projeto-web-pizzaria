<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PizzaLab - Login</title>
    <link rel="stylesheet" href="assets/css/global.css">

    <!-- fonte Kaushan Script do google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <!-- link para icon de user-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script type="module" src="./src/main.js"></script>
</head>
<body>

    <header id="header-container"></header>

    <main class="main-container">
        <section class="hero-side">
            <h1 class="hero-text">A melhor pizza da cidade,<br>entregue quentinha na sua porta 🍕</h1>
            <img src="assets/images/pizza-img.png" alt="Pizza demonstrativa" class="hero-pizza-img">
        </section>

        <section class="form-side">
            <div class="form-card">
                <div class="header-container">
                    <h2>Logar</h2>
                </div>

                <form class="card-container">
                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" required>
                    </div>

                    <div class="input-group">
                        <label for="password">Senha</label>
                        <input type="password" id="password" required>
                    </div>

                    <a href="#" class="forgot-password">Esqueci minha senha</a>

                    <div>
                        <button type="submit" class="btn-submit btn-cta" id="btn-login">Entrar</button>
                    </div>

                    <div class="signup-text">
                        Não possui conta? <a href="signup.html">Clique Aqui</a>
                    </div>
                </form>
            </div>
        </section>
    </main>
    <script type="module">
        import { fetchLogin } from "./src/services/api.js";
        document.getElementById('btn-login').addEventListener('click', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const senha = document.getElementById('password').value;
            
            try {
                const data = await fetchLogin(email, senha);
                localStorage.setItem('token', data.token);
                alert('login realizado com sucesso!');
                window.location.href = 'index.html';
            } catch (error) {
                console.error(error);
                alert(error.message);
            }
        });
    </script>
</body>
</html>
