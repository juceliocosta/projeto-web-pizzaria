<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizzalab</title>
    <link rel="stylesheet" href="assets/css/global.css">
</head>
<body>

<header>
    <h1>Pizzalab</h1>
</header>

<div class="main-container">
    <div class="menu-container" id="menu-container"></div>

    <aside class="cart-panel">
        <div class="cart-header">
            <h2>Meu Pedido</h2>
        </div>
        
        <div class="cart-items">
            <div class="cart-item">
                <div>
                    <strong>1x Margherita</strong><br>
                    <small>Média</small>
                </div>
                <span>R$ 45,00</span>
            </div>
            
            <div class="cart-item">
                <div>
                    <strong>1x Pepperoni</strong><br>
                    <small>Grande</small>
                </div>
                <span>R$ 52,00</span>
            </div>
        </div>

        <div class="cart-footer">
            <div class="total-row">
                <span>Total:</span>
                <span>R$ 97,00</span>
            </div>
            <button class="checkout-btn">Finalizar Pedido</button>
        </div>
    </aside>
</div>

<script type="module" src="./src/components/ContainerMenu.js"></script>
</body>
</html>
