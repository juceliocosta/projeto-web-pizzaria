<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PizzaLab - Login</title>
    <link rel="stylesheet" href="assets/css/global.css">

    <!-- fonte Kaushan Script do google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <!-- link para icon de user-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script type="module" src="./src/main.js"></script>
</head>
<body>

    <header id="header-container"></header>

    <main class="main-container">
        <section class="hero-side">
            <h1 class="hero-text">A melhor pizza da cidade,<br>entregue quentinha na sua porta 🍕</h1>
            <img src="assets/images/pizza-img.png" alt="Pizza demonstrativa" class="hero-pizza-img">
        </section>

        <section class="form-side">
            <div class="form-card">
                <div class="form-header">
                    <span>Cadastrar</span>
                </div>

                <form>
                    <div class="input-group">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" required>
                    </div>

                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" required>
                    </div>

                    <div class="input-container">
                      <div class="input-group">
                          <label for="password">Senha</label>
                          <input type="password" id="password" required>
                      </div>
  
                      <div class="input-group">
                          <label for="confirm-password">Confirmar Senha</label>
                          <input type="password" id="confirm-password" required>
                      </div>                    
                    </div>

                    <div>
                        <button type="submit" class="btn-submit" id="btn-signup">Cadastrar</button>
                    </div>

                    <div class="signup-text">
                        <a href="login.html">Já tenho Cadastro</a>
                    </div>
                </form>
            </div>
        </section>
    </main>
    <script type="module">
        import { fetchSignup } from "./src/services/api.js";
        document.getElementById('btn-signup').addEventListener('click', async (e) => {
            e.preventDefault();
            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const senha = document.getElementById('password').value;
            const confirmSenha = document.getElementById('confirm-password').value;

            if (senha !== confirmSenha) {
                alert('As senhas não coincidem.');
                return;
            }

            try {
                await fetchSignup(nome, email, senha);
                alert('Cadastro realizado com sucesso!');
                window.location.href = 'login.html';
            } catch (error) {
                console.error(error);
                alert(error.message);
            }
        });
    </script>

</body>
</html>
