<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizzalab</title>
    <link rel="stylesheet" href="assets/css/global.css">

    <!-- fonte Kaushan Script do google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <!-- link para icon de user-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script type="module" src="./src/components/Header.js"></script>
    <script type="module" src="./src/components/ContainerMenu.js"></script>
    <script type="module" src="./src/components/CartPanel.js"></script>
</head>
<body>

<header id="header-container"></header>

<div class="main-container">
    <div class="menu-container" id="menu-container"></div>

    <aside class="cart-panel" id="cart-panel">
        <div class="cart-header">
            <h2>Meu Pedido</h2>
        </div>
        
        <div class="cart-items" id="cart-items"></div>

        <div class="cart-footer">
            <div class="total-row">
                <span>Total:</span>
                <span id="total">R$ 0,00</span>
            </div>
            <button class="checkout-btn">Finalizar Pedido</button>
        </div>
    </aside>
</div>
</body>
</html>
